services:

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: sentiment-api
    ports:
      - "8000:8000"

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: sentiment-streamlit
    ports:
      - "8501:8501"
    depends_on:
      - api